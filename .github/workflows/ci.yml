name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run full test suite
        run: pytest -q
      - name: Audit documentation and release artifacts
        run: python scripts/check_repository.py --check-snippets
      - name: Smoke test benchmark CLI
        run: python -m alg_sharpsat.benchmarks --engine v3 --family coupled --sizes 18 --repeats 1
      - name: Smoke test weighted guardrail CLI
        run: wmc-guardrail-bench --sizes 6 --batch-size 4 --repeats 1 --skip-accelerators --json /tmp/guardrail-smoke.json
      - name: Smoke test interactive studio CLI
        run: wmc-guardrail-studio --demo-cli
